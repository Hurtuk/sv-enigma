@if (enigma(); as chapter) {
  <div class="enigma-wrapper" #enigmaWrapper>
    <i class="top-icon qr {{ chapter.color }}"></i>
    <h2>Chapitre {{ chapter.number }}</h2>
    @if (guessingPlace()) {
      <div class="enigma">
        <div class="place-enigma" [innerHtml]="chapter.placeEnigma | safeHtml"></div>
        @if (chapter.question) {
          <p>Trouvez la salle suivante, puis scannez le QR code de votre équipe.</p>
          <zxing-scanner
            [enable]="scanning()"
            (click)="scanning.set(true)"
            (scanSuccess)="onRoomScanned($event)"
            (scanError)="onScanError()"
          ></zxing-scanner>
        }
      </div>
    } @else {
      <h3>{{ chapter.name }}</h3>
      <div class="enigma">
        <div class="question" [innerHtml]="chapter.question | safeHtml"></div>
        <span class="remaining">{{ remaining() }} {{ remainingLabel() }}</span>
        <input
          type="text"
          [(ngModel)]="answer"
          [maxlength]="expectedLength()"
          [disabled]="errorOpen()"
          (keyup.enter)="closeKeyboard()"
        />
        <button
          #sendButton
          type="button"
          class="unlock-button"
          [disabled]="errorOpen() || loadingNext() || remaining() !== 0"
          (click)="validateAnswer()"
        >
          @if (loadingNext()) {
            <img src="/assets/images/ajax-loader.gif" width="50" alt="Chargement en cours" />
          } @else {
            Envoyer
          }
        </button>
      </div>
    }
  </div>
} @else {
  <img src="/assets/images/ajax-loader.gif" class="loader" alt="Chargement en cours" />
}

<div class="answer-panel panel-error" [class.opened]="errorOpen()">
  <h2>Erreur</h2>
  <p>{{ errorMessage() }}</p>
</div>
